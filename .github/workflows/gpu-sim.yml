# Optional, non-required check. The hosted runners have no GPU, so this builds
# a fast subset of the unit tests and runs it on a simulated NVIDIA A100
# (https://github.com/pantheongpu/pantheonsim). A simulator cannot reproduce
# hardware-specific behaviour or timing, so it complements real-GPU testing
# (Blossom-CI) and does not replace it.
name: GPU tests (simulated)

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gpu-tests:
    name: unit tests on a simulated A100
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@dda0c8df8d72627c295edbae525354ba2bcb1687 # v0.1.4
        with:
          gpu: nvidia/a100
          cuda-toolkit: "13.0"

      - name: Configure
        run: |
          # The simulator JIT-compiles PTX and does not run SASS, so embed PTX only
          # (CMakeLists.txt would otherwise emit sm_80 SASS) and use a shared cudart.
          sed -i 's/code=sm_\${cuda_arch}/code=compute_${cuda_arch}/' CMakeLists.txt
          cmake -B build -Dsm=80 -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared

      # Only tests with small table capacities are built and run here.
      - name: Build
        run: |
          cmake --build build -j2 --target \
            lock_unlock_test \
            reserved_keys_test \
            group_lock_test \
            merlin_memory_pool_test \
            uint32_score_test \
            save_and_load_test

      # Excluded because they fail on the simulator (see the PR description):
      #  - dynamic_max_capacity_test, find_with_missed_keys_test, export_batch_if_test,
      #    assign_values_test.test_evict_strategy_lru_basic: tlp_v2_upsert* kernels
      #  - uint32_score_test EvictCustomizedCorrectRateFull: needs more host memory
      #    than a hosted runner has to back the simulated device memory.
      # Only one save_and_load_test case runs; each takes about 80 s on the simulator.
      - name: Test
        run: |
          failed=0
          run() {
            echo "::group::$*"
            vgpu run "$@" || { echo "::error::$* failed"; failed=1; }
            echo "::endgroup::"
          }
          run ./build/lock_unlock_test
          run ./build/reserved_keys_test
          run ./build/group_lock_test
          run ./build/merlin_memory_pool_test
          run ./build/uint32_score_test --gtest_filter=-*EvictCustomizedCorrectRateFull
          run ./build/save_and_load_test --gtest_filter=*on_lru
          exit $failed
